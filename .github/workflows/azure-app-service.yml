name: Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Create Linux production package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/azure-package"
          mkdir -p "$package_dir/database"
          cp package.json package-lock.json "$package_dir/"
          cp -R dist contracts public "$package_dir/"
          cp -R database/migrations "$package_dir/database/"
          npm ci --omit=dev --prefix "$package_dir"
          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/deployment.zip" .
          )

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-package
          path: deployment.zip
          if-no-files-found: error

  deploy:
    needs: build-test
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: azure-deployment-package

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deployment.zip

      - name: Verify deployed health endpoint
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          health_url="https://${APP_NAME}.azurewebsites.net/api/v2/alojamientos/health"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/alojamientos-health.json --write-out '%{http_code}' "$health_url" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/alojamientos-health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP ${status:-no response}; retrying in 10 seconds."
            sleep 10
          done
          cat /tmp/alojamientos-health.json || true
          echo "The deployed health endpoint did not return HTTP 200."
          exit 1
