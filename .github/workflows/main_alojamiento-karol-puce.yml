name: Azure App Service - alojamiento-karol-puce

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-app-service-production
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

      - name: Create Linux production package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/azure-package"
          mkdir -p "$package_dir/database"
          cp package.json package-lock.json "$package_dir/"
          cp -R dist contracts public "$package_dir/"
          cp -R database/migrations "$package_dir/database/"
          npm ci --omit=dev --prefix "$package_dir"
          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/deployment.zip" .
          )

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: azure-deployment-package
          path: deployment.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: azure-deployment-package

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE0433D692DA4EB29A90AD41E6CE0A6D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DFBF4A5E8E1C429E866B4CC8EE30EB9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_31412793ED3E4C36845BFA946CF1DDD5 }}

      - name: Validate Azure App Service settings
        run: |
          set -euo pipefail
          app_name="alojamiento-karol-puce"
          resource_group="$(az webapp show --name "$app_name" --query resourceGroup --output tsv)"
          if [ -z "$resource_group" ]; then
            echo "::error::Azure Web App '$app_name' was not found."
            exit 1
          fi

          settings="$(az webapp config appsettings list --resource-group "$resource_group" --name "$app_name" --output json)"
          required_settings=(
            SUPABASE_URL
            SUPABASE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            API_KEY
            STOCK_SYNC_MODE
            BOOKING_REST_STOCK_URL
            BOOKING_CORE_API_URL
          )
          for key in "${required_settings[@]}"; do
            if ! jq -e --arg key "$key" \
              'any(.[]; .name == $key and ((.value // "") | tostring | length > 0))' \
              <<< "$settings" >/dev/null; then
              echo "::error::Required Azure App Setting '$key' is missing or empty. Configure it in App Service > Environment variables."
              exit 1
            fi
          done

          if ! jq -e \
            'any(.[]; .name == "STOCK_SYNC_MODE" and .value == "rest")' \
            <<< "$settings" >/dev/null; then
            echo "::error::Azure App Setting STOCK_SYNC_MODE must be 'rest'."
            exit 1
          fi
          if ! jq -e \
            'any(.[]; .name == "SUPABASE_URL" and (.value | startswith("https://")))' \
            <<< "$settings" >/dev/null; then
            echo "::error::Azure App Setting SUPABASE_URL must use HTTPS."
            exit 1
          fi
          if ! jq -e \
            'any(.[]; .name == "BOOKING_REST_STOCK_URL" and .value == "https://booking-core-api.azurewebsites.net/api/v3/inventory/stock")' \
            <<< "$settings" >/dev/null; then
            echo "::error::Azure App Setting BOOKING_REST_STOCK_URL does not match the Booking stock endpoint."
            exit 1
          fi
          if ! jq -e \
            'any(.[]; .name == "BOOKING_CORE_API_URL" and (.value | startswith("https://")))' \
            <<< "$settings" >/dev/null; then
            echo "::error::Azure App Setting BOOKING_CORE_API_URL must use HTTPS."
            exit 1
          fi

          echo "Required Azure App Settings are present. Secret values were not printed."
          echo "Confirm with Booking that API_KEY is authorized for stock and check-in requests."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: alojamiento-karol-puce
          slot-name: Production
          package: deployment.zip

      - name: Verify deployed health endpoint
        run: |
          set -euo pipefail
          health_url="https://alojamiento-karol-puce.azurewebsites.net/api/v2/alojamientos/health"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /tmp/alojamientos-health.json --write-out '%{http_code}' "$health_url" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/alojamientos-health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP ${status:-no response}; retrying in 10 seconds."
            sleep 10
          done
          cat /tmp/alojamientos-health.json || true
          echo "The deployed health endpoint did not return HTTP 200."
          exit 1
